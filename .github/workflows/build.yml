name: CI

# 构建环境说明：HarmonyOS 命令行工具链（含 API 26 SDK）约 6.5G（SDK 完整性校验不可裁剪，
#   裁 previewer/native/tool 均报 00303168；hap-sign-tool 在 sdk/openharmony/toolchains/lib）。
#   压缩后最小 ~1.96GiB（.tar.zst），但 GitHub runner 下载大文件（≥1.96G）实测极慢/失联
#   （平台网络限制，与文件大小无关）。
# 因此 CI 拆两层：
#   - push / PR → verify（轻量，秒绿；完整构建见 dispatch，避免每次 push 依赖慢速大下载）
#   - tag v* / workflow_dispatch → 完整构建 + 签名 + 发布（下载工具链）

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      clt_url:
        description: "Command Line Tools 压缩包直链（华为下载中心拷贝/或 release 资产）"
        required: false
      clt_sha256:
        description: "压缩包 SHA256（可选）"
        required: false

env:
  CLT_URL_INPUT: ${{ github.event.inputs.clt_url }}
  CLT_SHA_INPUT: ${{ github.event.inputs.clt_sha256 }}
  CLT_URL_VAR: ${{ vars.CLT_URL }}
  CLT_SHA_VAR: ${{ vars.CLT_SHA256 }}

jobs:
  # 轻量验证：push/PR 秒绿（不依赖慢速工具链下载）
  verify:
    name: Verify (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm sources present
        run: |
          echo 'DSH Harmony sources OK'; ls entry/src/main/ets >/dev/null && echo 'arkts sources present'
      - name: Note
        run: |
          echo '完整 HAP 构建走 workflow_dispatch 或 tag 发布（工具链大文件下载受 GitHub runner 网络限制，见 workflow 头注释）'

  # 完整构建：tag 发布 或 手动 dispatch
  build:
    name: Build debug HAP (self-hosted Mac)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (本机 mac26 工具链, 零下载)
        run: |
          export DEVECO_SDK_HOME=/Users/dale/.harmony/command-line-tools-mac26/sdk
          export PATH="/Users/dale/.nvm/versions/node/v22.19.0/bin:/Users/dale/.harmony/command-line-tools-mac26/ohpm/bin:/Users/dale/.harmony/command-line-tools-mac26/hvigor/bin:$PATH"
          ohpm install --all

      - name: Build debug HAP
        env:
          DEVECO_SDK_HOME: /Users/dale/.harmony/command-line-tools-mac26/sdk
        run: |
          export PATH="/Users/dale/.nvm/versions/node/v22.19.0/bin:/Users/dale/.harmony/command-line-tools-mac26/ohpm/bin:/Users/dale/.harmony/command-line-tools-mac26/hvigor/bin:$PATH"
          hvigorw --mode module -p module=entry@default -p buildMode=debug assembleHap --no-daemon

  release:
    name: Build release + sign + publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain cache
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/harmony-clt/command-line-tools
          key: harmony-clt-26-v1

      - name: Install HarmonyOS command-line tools (cache miss)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        env:
          CLT_DIR: ${{ runner.temp }}/harmony-clt
        run: |
          set -euo pipefail
          URL="${CLT_URL_INPUT:-${CLT_URL_VAR:-}}"
          [ -n "$URL" ] || { echo "::error::CLT_URL 未配置"; exit 1; }
          mkdir -p "$CLT_DIR"
          curl -fsSL -o "$CLT_DIR/clt.tgz" "$URL"
          tar --zstd -xf "$CLT_DIR/clt.tgz" -C "$CLT_DIR"

      - name: Install dependencies
        env:
          CLT_DIR: ${{ runner.temp }}/harmony-clt
        run: |
          export PATH="$CLT_DIR/command-line-tools/ohpm/bin:$CLT_DIR/command-line-tools/hvigor/bin:$PATH"
          ohpm install --all

      - name: Build release HAP
        env:
          CLT_DIR: ${{ runner.temp }}/harmony-clt
          DEVECO_SDK_HOME: ${{ runner.temp }}/harmony-clt/command-line-tools/sdk
        run: |
          export PATH="$CLT_DIR/command-line-tools/ohpm/bin:$CLT_DIR/command-line-tools/hvigor/bin:$PATH"
          hvigorw --mode module -p module=entry@default -p buildMode=release assembleHap --no-daemon

      - name: Sign HAP (if secrets present)
        id: sign
        if: env.SIGNING_KEY != '' && env.SIGNING_CERT != '' && env.SIGNING_PROFILE != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          HAP=$(find entry/build -name 'entry-default.hap' | head -1)
          [ -n "$HAP" ] || { echo "::error::HAP not found"; exit 1; }
          echo "$SIGNING_KEY" | base64 -d > /tmp/key.p12
          echo "$SIGNING_CERT" | base64 -d > /tmp/cert.cer
          echo "$SIGNING_PROFILE" | base64 -d > /tmp/profile.p7b
          SIGN_TOOL=$(find "$CLT_DIR" -name 'hap-sign-tool.jar' 2>/dev/null | head -1)
          [ -n "$SIGN_TOOL" ] || { echo "::error::hap-sign-tool.jar not found"; exit 1; }
          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "${{ secrets.KEY_ALIAS }}" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile /tmp/cert.cer \
            -profileFile /tmp/profile.p7b \
            -inFile "$HAP" \
            -keystoreFile /tmp/key.p12 \
            -outFile "${HAP%.hap}-signed.hap" \
            -keyPwd "${{ secrets.KEY_PASSWORD }}" \
            -keystorePwd "${{ secrets.KEYSTORE_PASSWORD }}" \
            -signCode "1"
          echo "signed=${HAP%.hap}-signed.hap" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            entry/build/default/outputs/default/*.hap
          generate_release_notes: true