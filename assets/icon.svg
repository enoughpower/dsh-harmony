<!-- DSH Harmony app icon (source of record)
     background: full-bleed diagonal gradient #4D6BFE -> #8B4DFF -> #D946EF (no disc, edge to edge)
     mark: monitor + phone as white bodies with gradient glass screens, casting a soft shadow
           monitor chin is deeper than the side bezels so it reads as a display, not a stroke
           phone is narrower, sits in front and drops a shadow onto the monitor
     layered icon splits into assets/icon-background.svg + assets/icon-foreground.svg
     generated by rendering this file with sharp/librsvg:
       AppScope/resources/base/media/{background,foreground}.png + layered_image.json
       entry/src/main/resources/base/media/{background,foreground}.png + layered_image.json
       entry/src/main/resources/base/media/startup.png  512
       entry/src/ohosTest/resources/base/media/icon.png  1024
       release/icon/icon-1024x1024.png (store master), release/icon/icon-216x216.png (AppGallery)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="0.52" stop-color="#8B4DFF"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="monitor" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="247" y="333" width="420" height="180" rx="18" fill="#000000"/>
      <rect x="599" y="309" width="236" height="436" rx="70" fill="#000000"/>
    </mask>
    <mask id="phone" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="649" y="375" width="136" height="308" rx="22" fill="#000000"/>
    </mask>
    <filter id="castShadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <feOffset in="blur" dx="10" dy="22" result="off"/>
      <feFlood flood-color="#0B1030" flood-opacity="0.34" result="col"/>
      <feComposite in="col" in2="off" operator="in"/>
    </filter>
    <mask id="notBody" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <g fill="#000000"><rect x="207" y="297" width="500" height="300" rx="50"/>
    <rect x="431" y="595" width="52" height="46" rx="12"/>
    <rect x="327" y="629" width="260" height="40" rx="20"/><rect x="617" y="327" width="200" height="400" rx="52"/></g>
    </mask>
    <mask id="monArea" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#000000"/>
      <g fill="#FFFFFF"><rect x="207" y="297" width="500" height="300" rx="50"/>
    <rect x="431" y="595" width="52" height="46" rx="12"/>
    <rect x="327" y="629" width="260" height="40" rx="20"/></g>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#gg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <g mask="url(#notBody)"><g filter="url(#castShadow)" fill="#000000"><rect x="207" y="297" width="500" height="300" rx="50"/>
    <rect x="431" y="595" width="52" height="46" rx="12"/>
    <rect x="327" y="629" width="260" height="40" rx="20"/><rect x="617" y="327" width="200" height="400" rx="52"/></g></g>
  <g mask="url(#monitor)">
    <rect x="207" y="297" width="500" height="300" rx="50" fill="#FFFFFF"/>
    <rect x="431" y="595" width="52" height="46" rx="12" fill="#FFFFFF"/>
    <rect x="327" y="629" width="260" height="40" rx="20" fill="#FFFFFF"/>
  </g>
  <g mask="url(#monArea)"><g filter="url(#castShadow)" fill="#000000"><rect x="617" y="327" width="200" height="400" rx="52"/></g></g>
  <g mask="url(#phone)">
    <rect x="617" y="327" width="200" height="400" rx="52" fill="#FFFFFF"/>
  </g>
</svg>