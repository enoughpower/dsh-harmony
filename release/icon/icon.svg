<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512"  fill="url(#bg)"/>
  <!-- 电脑:显示器 -->
  <rect x="108" y="132" width="200" height="134" rx="18" fill="none" stroke="url(#ac)" stroke-width="26"/>
  <rect x="136" y="160" width="144" height="80" rx="8" fill="url(#ac)" opacity="0.22"/>
  <!-- 电脑底座 -->
  <path d="M150 300 L248 300 L234 344 L164 344 Z" fill="url(#ac)"/>
  <rect x="140" y="352" width="128" height="22" rx="11" fill="url(#ac)" opacity="0.9"/>
  <!-- 手机 -->
  <rect x="292" y="196" width="104" height="212" rx="24" fill="none" stroke="url(#ac)" stroke-width="26"/>
  <rect x="316" y="228" width="56" height="84" rx="6" fill="url(#ac)" opacity="0.22"/>
  <circle cx="344" cy="382" r="13" fill="url(#ac)"/>
  <!-- 连接弧:电脑屏幕 → 手机 -->
  <path d="M250 210 C 320 176, 368 210, 380 260" stroke="url(#ac)" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="4 30"/>
  <circle cx="380" cy="262" r="20" fill="#FFD54F"/>
  <path d="M373 262 l 6 6 l 12 -14" stroke="#4D6BFE" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>